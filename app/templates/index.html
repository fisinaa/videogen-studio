<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VideoGen Studio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0b0d12;
      color: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0d12; }
    main { width: min(1180px, 94vw); margin: 0 auto; padding: 42px 0 80px; }
    h1 { font-size: 42px; margin: 0 0 8px; }
    .muted { color: #969cab; }
    .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 24px; margin-top: 30px; }
    .card {
      border: 1px solid #242936; border-radius: 18px; padding: 22px;
      background: #12151d;
    }
    textarea, select, input {
      width: 100%; margin-top: 7px; margin-bottom: 16px; padding: 12px 14px;
      background: #0d1016; color: #fff; border: 1px solid #303646;
      border-radius: 10px; font: inherit;
    }
    textarea { min-height: 185px; resize: vertical; }
    label { display: block; font-size: 14px; color: #c7cbd4; }
    .row { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    button {
      border: 0; border-radius: 10px; padding: 13px 18px; font-weight: 700;
      cursor: pointer; background: #7c5cff; color: white; font-size: 15px;
    }
    button:disabled { opacity: .55; cursor: wait; }
    pre {
      white-space: pre-wrap; overflow-wrap: anywhere; background: #0b0d12;
      border-radius: 12px; padding: 16px; min-height: 220px; color: #cad1df;
    }
    .scene {
      padding: 15px 0; border-top: 1px solid #252b37;
    }
    .scene:first-child { border-top: 0; }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 999px;
      background: #25203f; color: #bdafff; font-size: 12px;
    }
    .summary {
      display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px;
    }
    .error { color: #ff8d8d; }
    @media (max-width: 850px) {
      .grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <h1>VideoGen Studio</h1>
  <div class="muted">LLM backend: {{ llm_url }}</div>

  <div class="grid">
    <section class="card">
      <h2>Новый проект</h2>
      <form id="project-form">
        <label>
          Что хотим создать?
          <textarea id="prompt">Сделай первую сцену оригинального приключенческого мультфильма о маленьком мышонке, которого на игрушечном кораблике уносит течением далеко от дома. Атмосфера: природа, опасность, любопытство, без дословного пересказа существующих произведений.</textarea>
        </label>

        <div class="row">
          <label>Тип
            <select id="project_type">
              <option value="cartoon">Мультфильм</option>
              <option value="series_episode">Серия</option>
              <option value="video">Видео</option>
              <option value="reel">Reel</option>
            </select>
          </label>

          <label>Формат
            <select id="aspect_ratio">
              <option value="16:9">16:9</option>
              <option value="9:16">9:16</option>
              <option value="1:1">1:1</option>
            </select>
          </label>

          <label>Длительность, сек
            <input id="duration_seconds" type="number" min="10" max="7200" value="60">
          </label>
        </div>

        <button id="submit" type="submit">Создать storyboard</button>
      </form>
    </section>

    <section class="card">
      <h2>Результат</h2>
      <div id="status" class="muted">Жду задачу.</div>
      <div id="result"></div>
    </section>
  </div>

  <section class="card" style="margin-top:24px">
    <h2>Последние проекты</h2>
    {% if projects %}
      {% for project in projects %}
        <div class="scene">
          <span class="badge">{{ project.request.project_type }}</span>
          <strong>{{ project.storyboard.title }}</strong>
          <div class="muted">{{ project.id }}</div>
        </div>
      {% endfor %}
    {% else %}
      <div class="muted">Проектов пока нет.</div>
    {% endif %}
  </section>
</main>

<script>
const form = document.getElementById("project-form");
const result = document.getElementById("result");
const status = document.getElementById("status");
const submit = document.getElementById("submit");

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  submit.disabled = true;
  status.textContent = "LLM генерирует storyboard...";
  result.innerHTML = "";

  const body = {
    prompt: document.getElementById("prompt").value,
    project_type: document.getElementById("project_type").value,
    aspect_ratio: document.getElementById("aspect_ratio").value,
    duration_seconds: Number(document.getElementById("duration_seconds").value),
    language: "ru"
  };

  try {
    const response = await fetch("/api/projects", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.detail || "Unknown error");
    }

    status.textContent = "Готово. Project ID: " + data.id;
    const sb = data.storyboard;
    const totalDuration = sb.scenes.reduce(
      (sum, scene) => sum + Number(scene.duration_seconds || 0),
      0
    );

    result.innerHTML =
      "<h3>" + escapeHtml(sb.title) + "</h3>" +
      "<p>" + escapeHtml(sb.logline) + "</p>" +
      "<div class='muted'>" + escapeHtml(sb.visual_style) + "</div>" +
      "<div class='summary'>" +
        "<span class='badge'>Сцен: " + escapeHtml(sb.scenes.length) + "</span>" +
        "<span class='badge'>Storyboard: " + escapeHtml(totalDuration.toFixed(1)) + "s</span>" +
        "<span class='badge'>Запрошено: " + escapeHtml(body.duration_seconds) + "s</span>" +
      "</div>" +
      sb.scenes.map(scene =>
        "<div class='scene'>" +
        "<span class='badge'>" + escapeHtml(scene.id) + " · " +
        escapeHtml(scene.duration_seconds) + "s</span>" +
        "<h4>" + escapeHtml(scene.title) + "</h4>" +
        "<p><b>Действие:</b> " + escapeHtml(scene.action) + "</p>" +
        "<p><b>Наррация:</b> " + escapeHtml(scene.narration) + "</p>" +
        "<p class='muted'><b>Visual:</b> " + escapeHtml(scene.visual_prompt) + "</p>" +
        "</div>"
      ).join("");
  } catch (error) {
    status.innerHTML = "<span class='error'>Ошибка: " + escapeHtml(error.message) + "</span>";
  } finally {
    submit.disabled = false;
  }
});
</script>
</body>
</html>

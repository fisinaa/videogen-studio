services:
  web:
    build: .
    env_file:
      - .env
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VIDEOGEN_HOST: 0.0.0.0
      VIDEOGEN_PORT: 8090
      LLM_BASE_URL: http://host.docker.internal:8081/v1
